			function getPathBounds(pathNode) {
				const bbox = pathNode.getBBox();
				return {
					minX: bbox.x,
					minY: bbox.y,
					width: bbox.width,
					height: bbox.height,
				};
			}

			function createOptimizedSVG(pathData) {
				try {
					const tempSvg = document.createElementNS(
						"http://www.w3.org/2000/svg",
						"svg"
					);
					tempSvg.setAttribute("width", width);
					tempSvg.setAttribute("height", height);
					const tempPath = document.createElementNS(
						"http://www.w3.org/2000/svg",
						"path"
					);
					tempPath.setAttribute("d", pathData);
					tempSvg.appendChild(tempPath);
					document.body.appendChild(tempSvg);
					const bounds = getPathBounds(tempPath);
					document.body.removeChild(tempSvg);

					if (
						bounds.width === 0 ||
						bounds.height === 0 ||
						isNaN(bounds.width) ||
						isNaN(bounds.height)
					) {
						throw new Error("Invalid path bounds");
					}

					const padding = Math.max(bounds.width, bounds.height) * 0.05;
					const viewBoxWidth = bounds.width + padding * 2;
					const viewBoxHeight = bounds.height + padding * 2;
					const viewBoxX = bounds.minX - padding;
					const viewBoxY = bounds.minY - padding;

					return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}">
  <path d="${pathData}" fill="currentColor"/>
</svg>`;
				} catch (error) {
					throw new Error(`Failed to optimize SVG: ${error.message}`);
				}
			}

			function createSimplifiedSVG(countryCode) {
				if (fallbackPaths[countryCode]) {
					return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="${fallbackPaths[countryCode]}" fill="currentColor"/>
</svg>`;
				}
				return null;
			}

			function createReverseLookup() {
				const reverseLookup = {};
				for (const [id, iso] of Object.entries(countryNames)) {
					if (iso && officialCountries.includes(iso)) {
						if (!reverseLookup[iso]) {
							reverseLookup[iso] = [];
						}
						reverseLookup[iso].push(id);
					}
				}
				return reverseLookup;
			}

			// Function to fetch and process map data
			async function fetchMapData(url) {
				try {
					const response = await fetch(url);
					const data = await response.json();
					return topojson.feature(data, data.objects.countries).features;
				} catch (error) {
					log(`Error fetching map data from ${url}: ${error.message}`, "error");
					return [];
				}
			}

					const angle = (i / pointCount) * Math.PI * 2;
					// Add some randomness to the radius for a more natural look
					const variableRadius = radius * (0.7 + Math.random() * 0.6);
					const x = centerX + Math.cos(angle) * variableRadius;
					const y = centerY + Math.sin(angle) * variableRadius;
					randomPoints.push(`${x},${y}`);
				}

				const polygonPoints = randomPoints.join(" ");

				return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <polygon points="${polygonPoints}" fill="currentColor"/>
</svg>`;
			}

			createPreviewSVG();
			log(
				"Map generator initialized. Set to generate exactly 195 official countries.",
				"info"
			);

			generateButton.addEventListener("click", async () => {
				if (isGenerating) return;
				isGenerating = true;
				generateButton.disabled = true;

				const resolution = document.querySelector(
					'input[name="resolution"]:checked'
				).value;
				const useMultipleSources =
					document.getElementById("useMultipleSources").checked;

				log(
					`Starting SVG generation for 195 official countries with ${resolution} resolution...`,
					"info"
				);

				try {
					const zip = new JSZip();

					// Prepare variables to track progress
					const countriesRemaining = new Set(officialCountries);
					const generatedISOs = new Set();
					let accurateCount = 0;
					let fallbackCount = 0;
					let missingCount = 0;

					// Prepare sources to try
					const dataSourcesToTry = useMultipleSources
						? alternativeDataSources
						: [
								`https://unpkg.com/world-atlas@2.0.2/countries-${resolution}.json`,
						  ];

					// Try each data source sequentially
					for (
						let sourceIndex = 0;
						sourceIndex < dataSourcesToTry.length;
						sourceIndex++
					) {
						if (countriesRemaining.size === 0) break; // Skip if we already have all countries

						const sourceUrl = dataSourcesToTry[sourceIndex];
						const isAlternativeSource = sourceIndex > 0;

						log(
							`${
								isAlternativeSource
									? "Trying alternative data source"
									: "Using primary data source"
							}: ${sourceUrl}`,
							"info"
						);

						// Fetch data from this source
						const countries = await fetchMapData(sourceUrl);
						if (countries.length === 0) continue; // Skip empty sources

						// Set up D3 for mapping
						const projection = d3
							.geoNaturalEarth1()
							.scale(width / 2 / Math.PI)
							.translate([width / 2, height / 2]);
						const path = d3.geoPath().projection(projection);

						// Update preview if this is the first source
						if (sourceIndex === 0) {
							svg.selectAll("*").remove();
							svg
								.selectAll("path")
								.data(countries)
								.enter()
								.append("path")
								.attr("d", path)
								.attr("fill", "#34495e")
								.attr("stroke", "#fff")
								.attr("stroke-width", 0.5);
						}

						// Process countries from this data source
						for (const country of countries) {
							const id = country.id;
							const isoCode = countryNames[id];

							if (isoCode && countriesRemaining.has(isoCode)) {
								try {
									const countryPath = path(country);
									if (
										!countryPath ||
										countryPath === "M0,0z" ||
										countryPath === ""
									) {
										continue; // Skip invalid paths
									}

									// Create optimized SVG
									const svgContent = createOptimizedSVG(countryPath);
									zip.file(`${isoCode}.svg`, svgContent);
									generatedISOs.add(isoCode);
									countriesRemaining.delete(isoCode);
									accurateCount++;

									log(
										`Generated SVG for ${isoCode}${
											isAlternativeSource ? " (using alternative source)" : ""
										}`,
										"success"
									);
								} catch (error) {
									log(
										`Error processing ${isoCode} (${id}): ${error.message}`,
										"error"
									);
								}
							}
						}

						// Update progress
						updateProgress(accurateCount, 195);
						log(
							`Progress after data source ${
								sourceIndex + 1
							}: ${accurateCount} countries processed, ${
								countriesRemaining.size
							} remaining`,
							"info"
						);
					}

					// For remaining countries, try to use simplified shapes from our predefined collection
					if (countriesRemaining.size > 0) {
						log(
							`Using predefined simplified shapes for ${countriesRemaining.size} countries...`,
							"info"
						);

						for (const isoCode of [...countriesRemaining]) {
							const simplifiedSVG = createSimplifiedSVG(isoCode);

							if (simplifiedSVG) {
								zip.file(`${isoCode}.svg`, simplifiedSVG);
								generatedISOs.add(isoCode);
								countriesRemaining.delete(isoCode);
								fallbackCount++;

								log(`Used simplified shape for ${isoCode}`, "warning");
							}
						}

						updateProgress(accurateCount + fallbackCount, 195);
					}

					// For any still remaining countries, create generic country-like shapes
					if (countriesRemaining.size > 0) {
						log(
							`Creating generic country shapes for ${countriesRemaining.size} remaining countries...`,
							"warning"
						);

						for (const isoCode of countriesRemaining) {
							const genericSVG = createGenericCountrySVG(isoCode);

							zip.file(`${isoCode}.svg`, genericSVG);
							generatedISOs.add(isoCode);
							missingCount++;

							log(`Created generic shape for ${isoCode}`, "warning");
						}
					}

					// Final check
					if (generatedISOs.size !== 195) {
						log(
							`Warning: Generated ${generatedISOs.size} SVGs, which is not exactly 195. Please check results.`,
							"warning"
						);
					} else {
						log(
							`Success! Generated SVGs for all 195 official countries.`,
							"success"
						);
					}

					// Display statistics
					displayStatistics(accurateCount, fallbackCount, missingCount);

					// Generate the ZIP file
					log("Creating ZIP file...", "info");
					const zipBlob = await zip.generateAsync({ type: "blob" });
					saveAs(zipBlob, `195-official-countries-${resolution}.zip`);
					log(
						`✅ Complete! 195 official country SVGs packaged in ZIP file.`,
						"success"
					);
				} catch (error) {
					log(`❌ Error generating SVGs: ${error.message}`, "error");
				} finally {
					isGenerating = false;
					generateButton.disabled = false;
				}
			});
		</script>
	</body>
</html>
